<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Villarrosita · RECOEVO</title><style>
:root{--bg:#07120e;--fg:#f5f4eb;--lime:#c3f36b;--muted:#b5c1ba;--accent:#ff7b4e}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Inter,Arial,sans-serif;overflow:hidden}.deck{height:100dvh;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}.deck::-webkit-scrollbar{display:none}.slide{flex:0 0 100vw;width:100vw;height:100dvh;position:relative;overflow:hidden;scroll-snap-align:start;padding:7vh 7vw 13vh;background:radial-gradient(circle at 85% 15%,#1b392b,#0b1711 56%,#07120e);display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:5vw}.slide::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,14,10,.92) 0%,rgba(5,14,10,.77) 45%,rgba(5,14,10,.2) 100%);pointer-events:none}.slide>*{position:relative;z-index:1}.tag{color:var(--lime);font-size:clamp(12px,1.05vw,17px);font-weight:800;letter-spacing:.19em;text-transform:uppercase;margin-bottom:2vh}.copy{max-width:920px}.slide h1{font-size:clamp(45px,6.1vw,104px);line-height:.96;letter-spacing:-.06em;margin:0 0 3vh;max-width:1000px}.slide h2{font-size:clamp(38px,4.3vw,72px);line-height:.99;letter-spacing:-.05em;margin:0 0 2.6vh;max-width:1000px}.lead{font-size:clamp(22px,2.2vw,35px);line-height:1.27;max-width:840px;color:#f4f5ed}.sub{font-size:clamp(16px,1.35vw,22px);line-height:1.45;color:var(--muted);margin-top:2.5vh;max-width:810px}.photo{height:min(72vh,780px);width:100%;object-fit:cover;border-radius:4px;filter:saturate(.82);mask-image:linear-gradient(90deg,transparent 0%,black 11%)}.video-evidence{background:#132217}.cover,.thanks,.synth{grid-template-columns:1.1fr .9fr}.cover .photo,.thanks .photo,.synth .photo{height:100vh;max-height:none;position:absolute;right:0;top:0;width:59vw;mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.5) 27%,black 66%);z-index:0}.cover::before,.thanks::before,.synth::before{background:linear-gradient(90deg,#07120e 0%,rgba(7,18,14,.9) 40%,rgba(7,18,14,.28) 100%)}.cover h1{font-size:clamp(64px,10.8vw,176px);letter-spacing:-.085em;color:var(--lime)}.quote{font-size:clamp(29px,3.4vw,57px);font-weight:650;line-height:1.14;letter-spacing:-.035em;margin:3vh 0 2vh;max-width:1000px}.by{font-size:clamp(15px,1.2vw,20px);color:var(--lime);font-weight:700}.aside{font-size:clamp(16px,1.4vw,23px);line-height:1.42;color:var(--muted);margin-top:4vh;max-width:740px}.quote .copy{grid-column:1/-1;max-width:1300px}.photoquote .copy{max-width:820px}.mapbox{height:min(62vh,690px);width:100%;border:1px solid #496c53;position:relative;background:#14291c;overflow:hidden}.mapbox iframe{border:0;width:100%;height:100%;filter:saturate(.75) contrast(1.03)}.pin{position:absolute;left:54%;top:49%;width:22px;height:22px;background:var(--accent);border:3px solid white;border-radius:50%;box-shadow:0 0 0 0 rgba(255,123,78,.7);animation:pulse 1.8s infinite;pointer-events:none}.pin:after{content:"";position:absolute;inset:-10px;border:1px solid var(--accent);border-radius:50%;animation:ring 1.8s infinite}@keyframes pulse{70%{box-shadow:0 0 0 20px rgba(255,123,78,0)}}@keyframes ring{to{transform:scale(1.7);opacity:0}}.flow{grid-template-columns:1fr}.chart{grid-template-columns:1fr 1fr}.chartrows{display:grid;gap:2.2vh;margin-top:2.5vh;max-width:900px}.chartrow{display:grid;grid-template-columns:minmax(170px,1.4fr) 3fr 42px;align-items:center;gap:16px;font-size:clamp(15px,1.4vw,22px)}.track{height:13px;background:#293a30;border-radius:12px;overflow:hidden}.track i{height:100%;display:block;width:var(--w);background:linear-gradient(90deg,#92d74c,#d3fa80);transform-origin:left;animation:barin 1s cubic-bezier(.17,.67,.28,1) both;animation-delay:var(--d)}@keyframes barin{from{transform:scaleX(.01)}to{transform:scaleX(1)}}.chartrow b{font-size:clamp(18px,2vw,30px);color:var(--lime)}.denom{font-size:14px;color:var(--muted);margin-top:1.5vh}.maplink{display:inline-block;margin-top:2.5vh;color:var(--lime);font-weight:700;text-decoration:none;border-bottom:1px solid #98cc6b;padding-bottom:5px}.resultline span{background:#c3f36b}.flowline{display:flex;align-items:center;gap:1vw;flex-wrap:wrap;margin-top:7vh;max-width:1500px}.flowline span{font-size:clamp(20px,2.2vw,36px);font-weight:750;line-height:1.15;color:#07120e;background:var(--lime);padding:1.1rem 1.5rem;animation:rise .7s both}.flowline span:nth-child(2){animation-delay:.15s}.flowline span:nth-child(3){animation-delay:.3s}.flowline span:nth-child(4){animation-delay:.45s}.flowline span:nth-child(5){animation-delay:.6s}@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}.contrasts{display:flex;flex-direction:column;gap:4vh;margin-top:4vh}.contrasts blockquote{font-size:clamp(22px,2.1vw,35px);line-height:1.2;margin:0;border-left:2px solid var(--lime);padding-left:1.5vw}.contrasts blockquote:nth-child(2){border-color:var(--accent)}.mini{font-size:clamp(15px,1.15vw,19px);color:var(--muted);margin-top:1vh}.footer{position:absolute;bottom:2.7vh;left:7vw;right:7vw;z-index:3;display:flex;align-items:center;gap:18px;color:#aebdb3;font-size:13px;letter-spacing:.08em}.progress{height:3px;background:#395045;flex:1}.progress i{display:block;width:0;height:100%;background:var(--lime);transition:width .4s}.nav{position:absolute;right:7vw;bottom:5vh;z-index:4;display:flex;gap:10px}.nav button{border:1px solid #6d8b74;background:#11271b;color:white;width:48px;height:48px;border-radius:50%;font-size:24px;cursor:pointer}.nav button:hover{background:var(--lime);color:#07120e}</style></head><body><main class="deck" id="deck"></main><script>const slides=[{"type":"cover","title":"VILLARROSITA","lead":"Hallazgos integrados de entrevistas y recorrido de campo","sub":"Voces del sector · recorrido del 20 de septiembre de 2026 · RECOEVO","photo":"foto_chute.jpg","tag":"BOGOTÁ · USME"},{"type":"map","title":"Villarrosita, en Usme","lead":"Un punto para ubicar el trabajo de campo en el suroriente de Bogotá.","sub":"El pin es una referencia del enlace compartido. No define los límites del barrio ni la ruta completa.","photo":"foto_local.jpg","tag":"CONTEXTO DEL TERRITORIO"},{"type":"photo","title":"El chute y la basura que queda alrededor","lead":"En la imagen se ve un aviso que prohíbe botar residuos y basura suelta dentro y alrededor del depósito. Varias entrevistas describen problemas parecidos de bolsas abiertas y residuos dispersos.","photo":"foto_ladera.jpg","source":"Foto de campo · 20 sep 2026 · la imagen no muestra quién dejó los residuos.","tag":"LO QUE SE VE"},{"type":"chart","title":"Lo que más se repite en los turnos de participantes","lead":"Las referencias a dejar y recoger la basura aparecen más veces que las referencias a separar residuos. Cada barra cuenta turnos etiquetados; no personas.","tag":"LECTURA DEL CONJUNTO","counts":[["Disposición y recolección",53],["Separación y hábitos",21],["Impactos y salud",16],["Generación de residuos",10],["Confianza y gestión",10],["Soluciones mencionadas",9]],"denominator":320,"sub":"320 turnos de participantes · etiquetas exploratorias que pueden cruzarse."},{"type":"quote","title":"En distintas entrevistas, los residuos van juntos en la bolsa","lead":"En varias entrevistas aparece la misma práctica: restos de cocina y otros residuos terminan juntos.","quote":"“Pero como generalmente mantenemos esas las carreras, entonces uno que la cáscara de la papa a la misma bolsa, que el cartón, que esto, que las cáscaras de huevo, todo es un revoltijo.”","by":"Entrevistado/a · Audio1-U018","side":"En otras voces también aparecen el afán, la distancia al punto y la duda sobre cuándo pasa el camión.","tag":"VOCES QUE COINCIDEN"},{"type":"photoquote","title":"Las bolsas abiertas conectan el punto con la calle","lead":"Distintas entrevistas cuentan que la basura queda en esquinas, se abre y se dispersa; las fotos muestran residuos dentro y fuera del depósito.","photo":"foto_bolsas.jpg","quote":"“...a esas bolsas que ya están hechas a desarmarlas y dejar un desorden por todo eso...”","by":"Entrevistada · Audio8-U026","tag":"CALLE + ENTREVISTAS"},{"type":"photo","title":"Restos de comida aparecen junto a otros residuos","lead":"La foto muestra restos de alimentos, bolsas y envases en el mismo espacio. Varias entrevistas cuentan que la separación no suele ocurrir en origen.","photo":"foto_mezcla.jpg","source":"Observación directa · foto de campo, 20 sep 2026","tag":"LO ORGÁNICO EN EL PUNTO"},{"type":"photoquote","title":"Perros y residuos comparten espacio","lead":"La secuencia muestra perros cerca de bolsas y residuos. Varias voces dicen que buscan comida o rompen bolsas. El video no permite saber si están abandonados.","quote":"“...los animalitos de la calle, pues, también rebuscan ahí...”","by":"Entrevistada · Audio8-U010","tag":"ANIMALES Y RESIDUOS","video":"clip_02.mp4","source":"Video de campo · 7.47 a. m. · 13 s · audio silenciado"},{"type":"quote","title":"Hogares y comercios relatan prácticas distintas","lead":"En el conjunto aparecen tanto restos mezclados como sobras que se ofrecen a los perros. Las entrevistas no describen una práctica igual para todos.","quote":"“O sea, eso le echamos a los perritos cuando quieren comer.”","by":"Entrevistada · Audio6-U019","side":"Junto a este relato, otras entrevistas describen bolsas abiertas y comida expuesta. Son prácticas distintas que coexisten en el sector.","tag":"PRÁCTICAS QUE CONVIVEN"},{"type":"split","title":"La recolección aparece de forma desigual en los relatos","lead":"Varias entrevistas mencionan horarios inciertos, puntos que quedan lejos o sitios donde el camión no pasa. También se cuenta que algunas personas llevan las bolsas al punto disponible.","quote":"“Hace tres meses el carro no pasa por ahí.”","by":"Entrevistada · Audio6-U037","tag":"RECOLECCIÓN"},{"type":"photo","title":"El recorrido muestra pavimento junto a suelo húmedo","lead":"En esta toma, la vía pavimentada bordea un tramo de tierra húmeda y agua acumulada. Es una escena localizada, no una medida de todas las calles.","photo":"foto_barro.jpg","source":"Observación directa · foto de campo, 20 sep 2026","tag":"CAMINAR EL SECTOR"},{"type":"photoquote","title":"Las voces sitúan residuos en varias esquinas","lead":"Los relatos describen bolsas en esquinas, material abierto y residuos que vuelven a dispersarse. Las imágenes muestran distintos puntos del recorrido; no hay GPS para reconstruir una ruta exacta.","photo":"foto_esquina.jpg","quote":"“En las esquinas, pero las esquinas mantienen llenas de basura.”","by":"Entrevistada · Audio6-U034","tag":"UN PROBLEMA DE RECORRIDO"},{"type":"contrast","title":"Hay opiniones distintas sobre cuánto resuelve el chute","lead":"Algunas voces dicen que sí ayuda; otras describen bolsas abiertas, basura en esquinas o fallas de recolección. Las dos caras aparecen en este mismo conjunto.","a":"“…sí es bueno ese chux, pero al mismo tiempo, pues no, porque no, no se beneficia uno en nada.”","b":"“Para nosotros no, porque nosotros cogemos la basura y la llevamos y la echamos a la comunidad.”","by":"Entrevistado/a · Audio9-U020 / voz poco marcada · Audio7","tag":"DIFERENCIAS DENTRO DEL CONJUNTO"},{"type":"flow","title":"Las voces conectan cuatro momentos del desorden","lead":"Las entrevistas relacionan restos mezclados, bolsas dejadas fuera del punto o a destiempo, bolsas abiertas y residuos que se dispersan.","sub":"Síntesis de relatos de distintas entrevistas; no todos los pasos se observaron en cada caso.","tag":"PATRÓN QUE SE REPITE"},{"type":"synthesis","title":"Villarrosita: cuatro señales, un problema compartido","lead":"Los residuos se mezclan · el punto no siempre los contiene · los perros buscan alimento · la frecuencia del servicio y el estado de la vía forman parte del escenario.","sub":"Síntesis integrada de entrevistas y observación. Cada tema se respalda en varias voces o se marca como observación visual.","photo":"foto_chute.jpg","tag":"RESUMEN DE HALLAZGOS"},{"type":"method","title":"Ficha técnica · cómo leer estos resultados","lead":"10 audios emparejados con 10 transcripciones · 1:06:06 de grabación · 545 turnos extraídos · 22 fotos y 4 videos.","sub":"320 turnos de participantes para el conteo temático exploratorio. Audio2 dura 00:26 y Audio10 01:30 (permiso probable). Personas únicas: pendientes de cotejo. La autorización revisada pide citas sin nombre: se identifican por audio y turno. Un video de 13 s se integra en el hallazgo de perros. El pin no marca límites del barrio ni trayectos georreferenciados.","tag":"FICHA EJECUTIVA · AL FINAL"},{"type":"thanks","title":"Gracias","lead":"RECOEVO · Barrio Villarrosita","sub":"Lectura integrada de las voces y las escenas del recorrido.","photo":"foto_local.jpg","tag":"ESCUCHAR · PROBAR · MEJORAR"}];const deck=document.getElementById('deck');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));slides.forEach((s,i)=>{const e=document.createElement('section');e.className='slide '+s.type;e.innerHTML=`${s.video?`<video class="photo video-evidence" autoplay muted loop playsinline aria-label="${esc(s.title)}"><source src="media/${esc(s.video)}" type="video/mp4"></video>`:s.photo?`<img class="photo" src="media/${esc(s.photo)}" alt="${esc(s.title)}">`:''}<div class="copy"><div class="tag">${esc(s.tag)}</div><${s.type==='cover'||s.type==='thanks'?'h1':'h2'}>${esc(s.title)}</${s.type==='cover'||s.type==='thanks'?'h1':'h2'}>${s.lead?`<div class="lead">${esc(s.lead)}</div>`:''}${s.quote?`<blockquote class="quote">${esc(s.quote)}</blockquote><div class="by">${esc(s.by)}</div>`:''}${s.side?`<div class="aside">${esc(s.side)}</div>`:''}${s.source?`<div class="small">${esc(s.source)}</div>`:''}${s.sub?`<div class="sub">${esc(s.sub)}</div>`:''}${s.type==='map'?`<div class="pill">Usme · Bogotá D.C.</div>`:''}${s.type==='flow'?`<div class="flowline resultline"><span>Se mezclan</span><span>Se dejan</span><span>Se abren</span><span>Se dispersan</span></div>`:''}${s.type==='chart'?`<div class="chartrows">${s.counts.map(([label,value],j)=>`<div class="chartrow"><span>${esc(label)}</span><div class="track"><i style="--w:${(value/53*100).toFixed(1)}%;--d:${j*100}ms"></i></div><b>${value}</b></div>`).join('')}<div class="denom">${s.denominator} intervenciones de participantes · etiquetas que pueden coincidir</div></div>`:''}${s.type==='map'?`<a class="maplink" target="_blank" rel="noopener" href="https://maps.app.goo.gl/GzFsq4UZRQ7xFQm57?g_st=iw">Abrir ubicación compartida en Google Maps ↗</a>`:''}${s.type==='contrast'?`<div class="contrasts"><blockquote>${esc(s.a)}<div class="mini">Entrevistado · Audio9</div></blockquote><blockquote>${esc(s.b)}<div class="mini">Entrevistada · Audio7</div></blockquote></div><div class="mini">Fragmentos de transcripción; revisar en su contexto completo.</div>`:''}</div>${s.type==='map'?`<div class="mapbox"><iframe title="Mapa de referencia de Villarrosita, Usme" loading="lazy" src="https://maps.google.com/maps?q=4.6989312%2C-74.1081088&z=15&output=embed"></iframe><span class="pin"></span></div>`:''}<div class="footer"><span>RECOEVO · VILLARROSITA</span><div class="progress"><i></i></div><span class="count">${String(i+1).padStart(2,'0')} / ${slides.length}</span></div><div class="nav"><button aria-label="Anterior" data-dir="-1">‹</button><button aria-label="Siguiente" data-dir="1">›</button></div>`;deck.appendChild(e)});function go(d){let n=Math.max(0,Math.min(slides.length-1,Math.round(deck.scrollLeft/innerWidth)+d));deck.scrollTo({left:n*innerWidth,behavior:'smooth'})}document.addEventListener('click',e=>{if(e.target.matches('[data-dir]'))go(+e.target.dataset.dir)});document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1)}if(e.key==='Home')deck.scrollTo({left:0,behavior:'smooth'});if(e.key==='End')deck.scrollTo({left:(slides.length-1)*innerWidth,behavior:'smooth'})});const observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.querySelector('.progress i').style.width=((Array.from(deck.children).indexOf(e.target)+1)/slides.length*100)+'%';let v=e.target.querySelector('video');if(v)v.play().catch(()=>{});}else{let v=e.target.querySelector('video');if(v)v.pause();}}),{root:deck,threshold:.6});document.querySelectorAll('.slide').forEach(s=>observer.observe(s));</script></body></html>
